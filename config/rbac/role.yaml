  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.istio.io
  resources:
  - serviceentries/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - optimization.liorfranko.github.io
  resources:
  - istioadaptiverequestoptimizers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - optimization.liorfranko.github.io
